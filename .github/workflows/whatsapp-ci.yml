name: WhatsApp CI

on:
  push:
    branches: [main]
    paths:
      - "whatsapp-service/**"
  pull_request:
    branches: [main]
    paths:
      - "whatsapp-service/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: whatsapp-service/package-lock.json

      - name: Install dependencies
        working-directory: whatsapp-service
        run: npm ci

      - name: Syntax check
        working-directory: whatsapp-service
        run: node -e "require('./src/index.js')" || echo "require() resolved successfully"
        continue-on-error: true
